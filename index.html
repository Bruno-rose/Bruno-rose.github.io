<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bruno Rodríguez</title>
    <link rel="stylesheet" href="https://unpkg.com/98.css@0.1.20/dist/98.css" />
    <link rel="stylesheet" href="win98.css" />
    <style>
      #notepad {
        left: max(16px, calc(50% - 320px));
        top: 40px;
      }

      #cv {
        left: max(16px, calc(50% - 290px));
        top: 70px;
      }

      .window textarea {
        display: block;
        width: 100%;
        height: min(60dvh, 480px);
        flex: 1 1 auto; /* starting size; then follows the window's resize */
        min-height: 0;
        box-sizing: border-box;
        resize: none;
        padding: 6px 8px;
        font-family: "Fixedsys", "Lucida Console", "Courier New", monospace;
        font-size: 15px;
        line-height: 1.4;
      }

      #dino {
        left: max(16px, calc(50% - 230px));
        top: 130px;
      }

      #pinball {
        left: max(16px, calc(50% - 200px));
        top: 160px;
      }

      /* The port draws its own 606x480 Win98 frame; size the window to it */
      #pinball {
        width: min(614px, calc(100vw - 32px));
      }

      #pinball iframe {
        aspect-ratio: auto;
        height: 480px;
      }

      .game {
        width: min(680px, calc(100vw - 32px));
      }

      .game iframe {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        flex: 1 1 auto;
        min-height: 0;
        border: 0;
        background: #000;
      }

      .window.max iframe {
        aspect-ratio: auto;
      }
    </style>
  </head>
  <body>
    <main class="desktop">
      <section class="window" id="notepad">
        <div class="title-bar">
          <div class="title-bar-text">bruno.txt - Notepad</div>
          <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
          </div>
        </div>
        <nav class="menubar">
          <details class="menu">
            <summary>File</summary>
            <ul class="dropdown">
              <li><button data-open="cv">cv.txt</button></li>
              <li>
                <a
                  href="mailto:contact@brunorodriguez.dev?subject=Resume%20request"
                  >Request resume</a
                >
              </li>
              <li><hr /></li>
              <li><button data-close>Exit</button></li>
            </ul>
          </details>
          <a href="blog/index.html">Blog</a>
        </nav>
        <div class="window-body">
          <textarea spellcheck="false" aria-label="bruno.txt">
Bruno

Extremely curious. The world is fascinating
Chronically online. Love to see new tech
Love challenges. Just for accomplishments

Worked in early stage [Breezy] and late [Fintual] stage startups.

From Vallenar, Atacama, Chile, but lived on:
- Santiago (Chile)
- Paris (France)
- San Francisco (USA)

Want to talk? reach out at contact@brunorodriguez.dev
</textarea
          >
        </div>
      </section>

      <section class="window" id="cv" hidden>
        <div class="title-bar">
          <div class="title-bar-text">cv.txt - Notepad</div>
          <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
          </div>
        </div>
        <nav class="menubar">
          <details class="menu">
            <summary>File</summary>
            <ul class="dropdown">
              <li><button data-open="notepad">bruno.txt</button></li>
              <li>
                <a
                  href="mailto:contact@brunorodriguez.dev?subject=Resume%20request"
                  >Request resume</a
                >
              </li>
              <li><hr /></li>
              <li><button data-close>Exit</button></li>
            </ul>
          </details>
          <a href="blog/index.html">Blog</a>
        </nav>
        <div class="window-body">
          <textarea spellcheck="false" aria-label="cv.txt">
BRUNO RODRÍGUEZ

EXPERIENCE

TECH

ELSEWHERE
github.com/bruno-rose
linkedin.com/in/bruno-rodriguez-sepulveda
contact@brunorodriguez.dev
</textarea
          >
        </div>
      </section>

      <section class="window game" id="dino" hidden>
        <div class="title-bar">
          <div class="title-bar-text">Cadillacs and Dinosaurs - Arcade</div>
          <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
          </div>
        </div>
        <div class="window-body">
          <iframe
            data-src="https://archive.org/embed/arcade_dino"
            title="Cadillacs and Dinosaurs, via the Internet Archive"
            allow="fullscreen; autoplay; gamepad"
          ></iframe>
        </div>
        <div class="status-bar">
          <p class="status-bar-field">Capcom, 1993</p>
          <p class="status-bar-field">
            via <a href="https://archive.org/details/arcade_dino" target="_blank">Internet Archive</a>
          </p>
        </div>
      </section>

      <section class="window game" id="pinball" hidden>
        <div class="title-bar">
          <div class="title-bar-text">3D Pinball for Windows - Space Cadet</div>
          <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
          </div>
        </div>
        <div class="window-body">
          <iframe
            data-src="https://pinball.alula.me/"
            title="3D Pinball Space Cadet, web port"
            allow="fullscreen; autoplay; gamepad"
          ></iframe>
        </div>
        <div class="status-bar">
          <p class="status-bar-field">Microsoft, 1995</p>
          <p class="status-bar-field">
            web port by
            <a href="https://github.com/alula/SpaceCadetPinball" target="_blank">alula</a>
          </p>
        </div>
      </section>


    </main>

    <script src="win98.js"></script>
  </body>
</html>
